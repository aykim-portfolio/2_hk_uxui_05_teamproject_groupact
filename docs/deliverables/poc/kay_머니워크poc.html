<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머니워크 MoneyWalk — 걸으면서 줍는 경제뉴스 (PoC)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
  :root{
    --paper:#faf6ec; --paper2:#fffdf6; --inkl:#23272f; --sub:#8a8272; --line:#e2dbc9;
    --mustard:#e0a63a; --brick:#c96f4a; --olive:#7a8a4f; --slate:#5b7a99; --plum:#8a6f9e;
    --teal:#e0a63a; --teal-d:#23272f; --ink:#23272f; --up:#c0392b; --down:#3b82f6; --gold:#e0a63a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Pretendard","Malgun Gothic",-apple-system,sans-serif; background:#e9e3d3; color:var(--ink);
       display:flex; justify-content:center; min-height:100vh;}
  button{font-family:inherit; cursor:pointer;}
  .hand{font-family:'Gaegu','Pretendard',cursive;}

  /* ── 폰 프레임: 스케치북 ── */
  .app{width:390px; max-width:100vw; height:100vh; max-height:844px; background:var(--paper); position:relative;
       overflow:hidden; box-shadow:0 10px 34px rgba(60,50,30,.35); align-self:center; border-radius:20px;
       border:2.5px solid var(--inkl);}

  /* ── 상단 바 ── */
  .topbar{position:absolute; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:8px;
          padding:12px 12px 8px; color:var(--inkl);}
  .loc-chip{background:var(--paper2); border:2px solid var(--inkl); border-radius:999px; padding:6px 13px;
            font-size:13px; font-weight:800; box-shadow:2px 2px 0 rgba(35,39,47,.18);}
  .loc-chip small{font-weight:400; color:var(--sub); font-size:10.5px;}
  .lv-chip{margin-left:auto; background:var(--paper2); border:2px solid var(--inkl); border-radius:999px;
           padding:6px 11px; font-size:12px; font-weight:800; color:var(--inkl); display:flex; gap:6px; align-items:center;
           box-shadow:2px 2px 0 rgba(35,39,47,.18);}
  .lv-chip .bar{width:44px; height:6px; background:#ece5d3; border-radius:3px; overflow:hidden; border:1px solid #d8d0bb;}
  .lv-chip .fill{height:100%; background:var(--mustard); border-radius:3px; transition:width .5s;}

  /* ── 화면(탭) 전환 ── */
  .scene{position:absolute; inset:0; display:none;}
  .scene.active{display:block;}

  /* ═══ AR 탐색 뷰 ═══ */
  .ar-view{position:absolute; inset:0; overflow:hidden;}
  .sky{position:absolute; inset:0 0 38% 0;}
  .ground{position:absolute; left:0; right:0; bottom:0; height:40%;}
  .road{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:78%; height:38%;
        background:linear-gradient(#cfc7b2,#bdb49d); clip-path:polygon(38% 0, 62% 0, 100% 100%, 0 100%);
        border-top:2px solid rgba(35,39,47,.35);}
  .road::after{content:''; position:absolute; left:50%; top:0; bottom:0; width:5px; transform:translateX(-50%);
        background:repeating-linear-gradient(var(--mustard) 0 26px, transparent 26px 52px); opacity:.8;}
  .bld{position:absolute; bottom:36%; border-radius:6px 6px 0 0; border:2.5px solid var(--inkl); border-bottom:none;
       background:
         repeating-linear-gradient(rgba(35,39,47,.10) 0 2.5px, transparent 2.5px 20px),
         repeating-linear-gradient(90deg, rgba(35,39,47,.10) 0 2.5px, transparent 2.5px 20px),
         var(--bcolor,#fffdf6);}
  .bld .sign{position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:19px;
             background:var(--paper2); border:2px solid var(--inkl); border-radius:7px; padding:2px 6px;}
  .cam-note{position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:9;
            background:var(--paper2); border:1.5px dashed var(--inkl); color:#6d6656; font-size:10px;
            border-radius:6px; padding:3px 9px; white-space:nowrap;}

  /* AR 마커 */
  .marker{position:absolute; z-index:20; transform:translate(-50%,-50%); text-align:center; background:none; border:none;}
  .marker .pulse{position:absolute; left:50%; top:26px; transform:translate(-50%,-50%); width:64px; height:64px;
                 border-radius:50%; border:2.5px dashed var(--mustard); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{transform:translate(-50%,-50%) scale(.55); opacity:.95;} 100%{transform:translate(-50%,-50%) scale(1.5); opacity:0;}}
  .marker .orb{position:relative; width:52px; height:52px; margin:0 auto;
               border-radius:48% 52% 55% 45% / 55% 58% 42% 45%;
               background:var(--paper2); border:2.5px solid var(--inkl);
               display:flex; align-items:center; justify-content:center; font-size:24px;
               box-shadow:3px 3px 0 rgba(35,39,47,.2); animation:bob 2.6s ease-in-out infinite;}
  .marker.gotcha .orb{opacity:.45; filter:grayscale(1); box-shadow:none; animation:none;}
  .marker.gotcha .pulse{display:none;}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);}}
  .marker .tag{margin-top:5px; display:inline-block; background:var(--inkl); color:var(--paper); font-size:10.5px;
               font-weight:700; border-radius:6px; padding:3px 8px; white-space:nowrap;}
  .marker .dist{display:block; font-size:9.5px; color:#6d6656; font-weight:700; margin-top:2px;}
  .radar{position:absolute; bottom:86px; left:12px; z-index:22; background:var(--paper2); color:var(--inkl);
         border:2px solid var(--inkl); border-radius:999px; padding:7px 13px; font-size:11.5px; font-weight:800;
         box-shadow:2px 2px 0 rgba(35,39,47,.18);}

  /* 산책 강아지 마스코트 */
  .mascot{position:absolute; bottom:13%; left:50%; transform:translateX(-50%); z-index:16; text-align:center; pointer-events:none;}
  .mascot svg{animation:bob 2.2s ease-in-out infinite; filter:drop-shadow(2px 3px 0 rgba(35,39,47,.15));}
  .mascot .bubble{display:inline-block; background:var(--paper2); border:2px solid var(--inkl); border-radius:12px;
                  padding:3px 11px; font-size:14px; font-weight:700; margin-bottom:4px;}

  /* ═══ 지도 뷰 ═══ */
  .map{position:absolute; inset:0; background:#e8efe6;
       background-image:
         linear-gradient(rgba(180,200,180,.5) 2px, transparent 2px),
         linear-gradient(90deg, rgba(180,200,180,.5) 2px, transparent 2px);
       background-size:46px 46px;}
  .map .river{position:absolute; top:44%; left:-10%; right:-10%; height:60px; background:#bcd9ee; transform:rotate(-7deg); border-radius:40px;}
  .map-title{position:absolute; top:76px; left:0; right:0; text-align:center; z-index:5; color:#374151; font-size:12px; font-weight:700;}
  .pin{position:absolute; z-index:6; transform:translate(-50%,-100%); text-align:center; background:none; border:none;}
  .pin .p-orb{width:46px; height:46px; border-radius:50% 50% 50% 8px; transform:rotate(-45deg); margin:0 auto;
              background:var(--paper2); display:flex; align-items:center; justify-content:center;
              box-shadow:3px 3px 0 rgba(35,39,47,.2); border:2.5px solid var(--inkl);}
  .pin .p-orb span{transform:rotate(45deg); font-size:19px;}
  .pin.here .p-orb{background:var(--mustard);}
  .pin .p-name{margin-top:6px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 8px;
               font-size:11px; font-weight:800; color:#111; box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .pin .p-cnt{font-size:9.5px; color:var(--teal-d); font-weight:700;}
  .me-dot{position:absolute; z-index:7; width:16px; height:16px; border-radius:50%; background:#3b82f6;
          border:3px solid #fff; box-shadow:0 0 0 6px rgba(59,130,246,.25); transform:translate(-50%,-50%);}

  /* ═══ 산책 수첩 뷰 ═══ */
  .dex{position:absolute; inset:0; background:var(--paper); overflow-y:auto; padding:70px 16px 96px;}
  .dex h2{color:var(--inkl); font-size:24px; margin-bottom:3px; font-family:'Gaegu',cursive;}
  .dex .dex-sub{color:var(--sub); font-size:12px; margin-bottom:14px;}
  .dex-xp{background:var(--paper2); border:2px solid var(--inkl); border-radius:14px; padding:14px; margin-bottom:16px;
          color:var(--inkl); box-shadow:3px 3px 0 rgba(35,39,47,.15);}
  .dex-xp .row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dex-xp .em{font-size:24px;}
  .dex-xp .nm{font-weight:900; font-size:15px;}
  .dex-xp .lv{font-size:11px; color:var(--sub);}
  .dex-xp .st{margin-left:auto; background:#f5e6c4; color:#8a6413; border:1.5px solid #d8c48e; font-size:10.5px; font-weight:800; border-radius:6px; padding:3px 7px;}
  .dex-xp .bar{height:9px; background:#ece5d3; border-radius:5px; overflow:hidden; border:1px solid #d8d0bb;}
  .dex-xp .fill{height:100%; background:var(--mustard); transition:width .6s;}
  .dex-xp .nxt{font-size:10.5px; color:var(--sub); margin-top:5px;}
  /* 폴더형 도감 그리드 */
  .dex-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .folder{position:relative; height:152px; background:none; border:none; text-align:left; padding:0;}
  .folder:active{transform:scale(.97);}
  .f-tab{position:absolute; top:6px; left:0; width:46%; height:36px; z-index:1;
         border-radius:12px 16px 0 0; background:var(--fmain);}
  .f-back{position:absolute; top:20px; left:0; right:0; bottom:0; z-index:1; border-radius:14px; background:var(--fback);}
  .f-papers{position:absolute; top:4px; left:0; right:0; z-index:2; display:flex; justify-content:center;}
  .f-paper{width:36px; height:46px; background:#fff; border-radius:5px; margin:0 -7px; position:relative;
           box-shadow:0 1px 4px rgba(0,0,0,.22); transform:rotate(var(--rot)); top:var(--top);}
  .f-paper::before{content:''; position:absolute; left:7px; right:7px; top:8px; height:3px;
                   background:#dbe2ea; border-radius:2px; box-shadow:0 7px 0 #e8edf3, 0 14px 0 #e8edf3;}
  .f-paper.q{display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px;
             color:#8494ab; background:#dde4ec;}
  .f-paper.q::before{display:none;}
  .f-front{position:absolute; left:0; right:0; bottom:0; height:63%; z-index:3; border-radius:14px;
           background:linear-gradient(155deg, var(--fmain), var(--fdark));
           padding:10px 12px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff;
           box-shadow:0 -2px 8px rgba(0,0,0,.12) inset;}
  .f-name{font-size:11.5px; font-weight:800; line-height:1.35; opacity:.97;}
  .f-loc{font-size:9px; opacity:.62; margin-top:2px;}
  .f-cnt{position:absolute; right:12px; bottom:9px; font-size:21px; font-weight:900; letter-spacing:-.5px;}
  .f-cnt small{font-size:11px; opacity:.7; font-weight:800;}
  .f-done{position:absolute; top:26px; right:8px; z-index:4; background:#22c55e; color:#fff; width:22px; height:22px;
          border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;
          box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .folder.empty .f-tab{background:#cfc7b2;}
  .folder.empty .f-back{background:#e0d9c6;}
  .folder.empty .f-front{background:linear-gradient(155deg,#cfc7b2,#b3aa93);}
  .folder.empty .f-name{opacity:.85;}
  .dex-tip{color:var(--sub); font-size:12.5px; text-align:center; margin-top:14px; font-family:'Gaegu',cursive;}

  /* 손그림 이정표 */
  .roadsign{position:absolute; top:72px; left:50%; transform:translateX(-50%) rotate(-1.2deg); z-index:5; min-width:230px;
            background:var(--paper2); border:2.5px solid var(--inkl); border-radius:12px; padding:11px 16px 9px;
            color:var(--inkl); text-align:center; box-shadow:3px 4px 0 rgba(35,39,47,.2);}
  .roadsign .rs-big{font-size:16px; font-weight:700; letter-spacing:-.3px; font-family:'Gaegu',cursive;}
  .roadsign .rs-big .rs-n{display:inline-flex; width:18px; height:18px; border-radius:50%; background:var(--inkl);
            color:var(--paper); font-size:11px; font-weight:900; align-items:center; justify-content:center;
            vertical-align:1px; margin-right:5px;}
  .roadsign .rs-rom{font-size:8.5px; color:var(--sub); margin-top:1px; letter-spacing:.5px;}
  .roadsign .rs-sub{font-size:11px; color:#6d6656; margin-top:6px; border-top:1.5px dashed var(--inkl); padding-top:5px; font-family:'Gaegu',cursive;}

  /* ── 하단 탭 바 ── */
  .tabbar{position:absolute; bottom:0; left:0; right:0; z-index:40; display:flex; background:var(--paper2);
          border-top:2.5px solid var(--inkl); padding:8px 0 12px;}
  .tabbar button{flex:1; background:none; border:none; color:#b3aa93; font-size:11px; font-weight:800;}
  .tabbar button .ico{display:block; font-size:21px; margin-bottom:2px; filter:grayscale(1); opacity:.5;}
  .tabbar button.on{color:var(--inkl);}
  .tabbar button.on .ico{filter:none; opacity:1;}

  /* ── 바텀시트 (스팟 상세) ── */
  .sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none;}
  .sheet-bg.open{display:block;}
  .sheet{position:absolute; left:0; right:0; bottom:0; z-index:51; background:#fff; border-radius:20px 20px 0 0;
         padding:14px 18px 24px; max-height:76%; overflow-y:auto; transform:translateY(105%); transition:transform .28s;}
  .sheet.open{transform:none;}
  .sheet .grab{width:42px; height:4px; background:#d1d5db; border-radius:2px; margin:0 auto 12px;}
  .sh-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .sh-emoji{width:46px; height:46px; border-radius:14px; background:var(--paper); border:2px solid var(--inkl);
            display:flex; align-items:center; justify-content:center; font-size:24px;}
  .sh-name{font-weight:900; font-size:16px;}
  .sh-loc{font-size:11px; color:var(--sub);}
  .stat-card{background:var(--paper2); color:var(--inkl); border:2.5px solid var(--inkl); border-radius:14px;
             padding:14px 16px; margin-bottom:14px; box-shadow:3px 3px 0 rgba(35,39,47,.15);}
  .stat-card .s-label{font-size:11.5px; color:#6d6656;}
  .stat-card .s-value{font-size:26px; font-weight:900; margin:3px 0;}
  .stat-card .s-delta{font-size:12px; font-weight:800;}
  .stat-card .s-delta.up{color:var(--up);} .stat-card .s-delta.down{color:var(--down);}
  .stat-card .s-src{font-size:9.5px; color:#b3aa93; margin-top:6px;}
  .sh-sub{font-size:12.5px; font-weight:900; color:#374151; margin:0 0 8px;}
  .news-item{border:2px solid var(--line); border-radius:12px; padding:12px; margin-bottom:9px; background:#fff;}
  .news-item h4{font-size:13.5px; line-height:1.45; margin-bottom:4px;}
  .news-item .n-sum{font-size:11.5px; color:var(--sub); line-height:1.5;}
  .n-impact{margin-top:8px; background:#fdf6e3; border:1.5px dashed #c9a856; border-radius:9px; padding:7px 9px;
            font-size:11px; color:#5a5142; line-height:1.5;}
  .n-impact b.t{color:#a1771c;}
  .pick-btn{width:100%; margin-top:6px; background:var(--inkl); color:var(--paper); border:none; border-radius:999px;
            padding:14px; font-size:14.5px; font-weight:900;}
  .pick-btn:disabled{background:#cfc7b2; color:#8a8272;}
  .read-chip{display:inline-block; background:#f2e8cf; color:#8a6413; border:1px solid #d8c48e; font-size:9.5px;
             font-weight:800; border-radius:4px; padding:1.5px 6px; margin-left:6px; vertical-align:2px;}

  /* ── 기사 리더 (끝까지 읽어야 줍기 활성화) ── */
  .reader{position:absolute; inset:0; z-index:55; background:#fff; transform:translateX(100%);
          transition:transform .28s; display:flex; flex-direction:column;}
  .reader.open{transform:none;}
  .reader-top{display:flex; align-items:center; gap:10px; padding:13px 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
  .reader-top .r-back{background:none; border:none; font-size:19px; line-height:1;}
  .reader-top .r-src{font-size:12px; font-weight:800; color:#374151;}
  .reader-body{flex:1; overflow-y:auto; padding:20px 20px 28px;}
  .r-cat{font-size:11px; font-weight:800; color:var(--teal-d); margin-bottom:7px;}
  .reader-body h2{font-size:19px; line-height:1.45; margin-bottom:9px; word-break:keep-all;}
  .r-meta{font-size:11px; color:#9ca3af; padding-bottom:13px; border-bottom:1px solid var(--line); margin-bottom:15px;}
  .r-p{font-size:14px; line-height:1.85; color:#1f2937; margin-bottom:15px; word-break:keep-all;}
  .r-impact-title{font-size:12.5px; font-weight:900; color:#0f766e; margin:18px 0 7px;}

  /* ── 토스트 ── */
  .toasts{position:absolute; top:96px; left:0; right:0; z-index:60; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none;}
  .toast{background:rgba(17,24,39,.92); color:#fff; border-radius:8px; padding:9px 15px; font-size:12.5px; font-weight:800;
         animation:tIn .25s, tOut .4s 2.3s forwards;}
  @keyframes tIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1;}}
  @keyframes tOut{to{opacity:0; transform:translateY(-8px);}}

  /* ── 두들 강아지 캐릭터 (손그림 강아지 레퍼런스) ── */
  .dog-slot{display:inline-block; flex-shrink:0; line-height:0;}
  .dog-slot svg{display:block;}
  .doodle-note{position:absolute; font-family:'Gaegu',cursive; font-size:12.5px; color:#a89d85; transform:rotate(-4deg); white-space:nowrap;}

  /* ── 온보딩 (WALK THE DOG 스케치북 무드) ── */
  .onb{position:absolute; inset:0; z-index:70; background:var(--paper); color:var(--inkl);
       display:flex; flex-direction:column; justify-content:center; padding:28px 24px; overflow-y:auto;}
  .blob-row{display:flex; justify-content:center; align-items:flex-end; gap:14px; margin-bottom:14px;}
  .blob-row .dog-slot{animation:bob 2.8s ease-in-out infinite;}
  .blob-row .dog-slot:nth-child(2){animation-delay:.4s;} .blob-row .dog-slot:nth-child(3){animation-delay:.8s;}
  .blob-row .dog-slot:nth-child(4){animation-delay:1.2s;}
  .onb .step{text-align:center; font-size:11px; font-weight:900; color:#b3aa93; letter-spacing:3px; margin-bottom:7px;}
  .onb h1{font-size:30px; text-align:center; line-height:1.35; margin-bottom:10px; word-break:keep-all;
          font-family:'Gaegu',cursive; font-weight:700;}
  .onb h1 b{color:var(--brick);}
  .onb p{font-size:12.5px; color:#6d6656; text-align:center; line-height:1.7; margin-bottom:18px; word-break:keep-all;}
  .pcards{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:20px;}
  .pcard{background:var(--paper2); border:2px solid var(--inkl); border-radius:18px; padding:13px; min-height:88px;
         display:flex; justify-content:space-between; align-items:flex-end; gap:6px;
         box-shadow:3px 3px 0 rgba(35,39,47,.12); cursor:pointer;}
  .pcard .p-label{font-size:13px; font-weight:800; color:var(--inkl); text-align:left; line-height:1.45; align-self:flex-start;}
  .pcard.sel{border-color:var(--brick); background:#fbeee6; box-shadow:3px 3px 0 rgba(201,111,74,.35);}
  .onb .go{background:var(--inkl); color:var(--paper); border:none; border-radius:999px; padding:15px; font-size:14.5px; font-weight:900;}
  .onb .skip{background:none; border:none; color:#b3aa93; font-size:12px; margin-top:11px; text-decoration:underline;}
  .onb .powered{position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:10px; color:#c4bba6;}

  .poc-note{position:absolute; bottom:64px; right:10px; z-index:41; background:rgba(0,0,0,.55); color:#94a3b8;
            font-size:9px; padding:3px 7px; border-radius:4px;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 상단 바 -->
  <div class="topbar">
    <span class="loc-chip" id="locChip">📍 역삼동 오피스텔 거리 <small>서울 강남구</small></span>
    <span class="lv-chip" id="lvChip"></span>
  </div>

  <!-- AR 탐색 -->
  <div class="scene active" id="scene-ar">
    <div class="ar-view" id="arView"></div>
    <span class="cam-note">📷 카메라 화면 시뮬레이션 (PoC)</span>
    <span class="radar" id="radar"></span>
  </div>

  <!-- 지도 -->
  <div class="scene" id="scene-map">
    <div class="map" id="mapView"></div>
    <div class="roadsign" id="roadsign"></div>
  </div>

  <!-- 도감 -->
  <div class="scene" id="scene-dex">
    <div class="dex" id="dexView"></div>
  </div>

  <!-- 하단 탭 -->
  <div class="tabbar">

/* ─────────────────────────────────────────────
   상태
───────────────────────────────────────────── */
let mwProfile  = JSON.parse(localStorage.getItem('mw_profile') || 'null');   // null = 온보딩 전
let mwXp       = parseInt(localStorage.getItem('mw_xp')||'0',10);
let collected  = new Set(JSON.parse(localStorage.getItem('mw_collected')||'[]'));
let readNews   = new Set(JSON.parse(localStorage.getItem('mw_read')||'[]'));  // 끝까지 읽은 뉴스
let curLoc     = localStorage.getItem('mw_loc') || 'yeoksam';
let curPoi     = null;

function save(){
  localStorage.setItem('mw_xp', String(mwXp));
  localStorage.setItem('mw_collected', JSON.stringify([...collected]));
  localStorage.setItem('mw_read', JSON.stringify([...readNews]));
  localStorage.setItem('mw_loc', curLoc);
}
function levelOf(v){ let i=0; LEVELS.forEach((l,k)=>{ if(v>=l.min) i=k; }); return i; }

/* 탭 헬퍼: click이 씹히는 환경(터치/임베드 패널) 대비 pointerup 폴백 + 중복 방지 */
function onTap(el, fn){
  let last = 0;
  el.addEventListener('pointerup', e=>{
    if(e.button !== undefined && e.button !== 0) return;
    last = Date.now(); fn(e);
  });
  el.addEventListener('click', e=>{
    if(Date.now() - last < 600) return; // pointerup에서 이미 처리됨
    fn(e);
  });
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(), 3000);
}
function addXP(n, reason){
  const before=levelOf(mwXp); mwXp+=n; save();
  toast(`+${n} XP · ${reason}`);
  const after=levelOf(mwXp);
  if(after!==before) setTimeout(()=>toast(`${LEVELS[after].emoji} 레벨 업! ${LEVELS[after].name} 달성`), 500);
  renderLvChip();
  renderRoadsign();
}

/* ─────────────────────────────────────────────
   렌더링: 상단 레벨칩 / AR / 지도 / 도감
───────────────────────────────────────────── */
function renderLvChip(){
  const li=levelOf(mwXp), cur=LEVELS[li], next=LEVELS[li+1];
  const pct = next ? Math.min(100, Math.round((mwXp-cur.min)/(next.min-cur.min)*100)) : 100;
  document.getElementById('lvChip').innerHTML =
    `${cur.emoji} Lv.${li+1} <span class="bar"><span class="fill" style="width:${pct}%"></span></span> ${mwXp}XP`;
}

function renderAR(){
  const loc = LOCATIONS[curLoc];
  document.getElementById('locChip').innerHTML = `📍 ${loc.name} <small>${loc.gu}</small>`;
  const pois = Object.entries(POIS).filter(([id,p])=>p.loc===curLoc);
  const allClear = pois.every(([id,p])=>p.news.every((n,i)=>collected.has(id+'_'+i)));
  document.getElementById('arView').innerHTML = `
    <div class="sky" style="background:${loc.sky}"></div>
    <div class="ground" style="background:linear-gradient(#ded6c2,#cfc7b2)"></div>
    ${loc.buildings.map(b=>`<div class="bld" style="left:${b.left}; width:${b.width}; height:${b.height}; --bcolor:${b.color};"><span class="sign">${b.sign}</span></div>`).join('')}
    <div class="road"></div>
    <div class="mascot">
      <span class="bubble hand">${allClear ? '이 동네 산책 끝! 멍 🦴' : '킁킁… 뉴스 냄새! 🐾'}</span><br>
      ${dogWalkSvg('#c96f4a')}
    </div>
    ${pois.map(([id,p])=>{
      const done = p.news.every((n,i)=>collected.has(id+'_'+i));
      return `<button class="marker ${done?'gotcha':''}" data-poi="${id}" style="left:${p.x}%; top:${p.y}%;">
        <span class="pulse"></span>
        <span class="orb">${p.emoji}</span>
        <span class="tag">${p.name}${done?' ✓':''}</span>
        <span class="dist">${p.dist}</span>
      </button>`;
    }).join('')}`;
  document.getElementById('radar').textContent = `🐾 뉴스 냄새 ${pois.length}곳`;
  document.querySelectorAll('.marker').forEach(m=>{
    onTap(m, ()=>openSheet(m.dataset.poi));
  });
}

/* 도로표지판: 다음 레벨 이정표 + 미룸 유머 */
function renderRoadsign(){
  const el = document.getElementById('roadsign');
  if(!el) return;
  const li = levelOf(mwXp), next = LEVELS[li+1];
  el.innerHTML = next ? `
    <div class="rs-big"><span class="rs-n">${li+2}</span>↑ ${next.name} <small style="opacity:.8;">${next.min-mwXp} XP</small></div>
    <div class="rs-rom">${next.rom} ${next.min-mwXp}XP</div>
    <div class="rs-sub">← 안 읽음 <i>Anilgeum</i> &nbsp;·&nbsp; 미룸 <i>Mirum</i> →</div>`
    : `
    <div class="rs-big">🏆 정상 도착 · 경제 프로</div>
    <div class="rs-rom">Gyeongje Pro — You made it!</div>`;
}

function renderMap(){
  renderRoadsign();
  const el = document.getElementById('mapView');
  el.innerHTML = `
    <div class="river"></div>
    <div class="me-dot" style="left:${LOCATIONS[curLoc].mapX}%; top:${LOCATIONS[curLoc].mapY + 9}%;"></div>
    ${Object.entries(LOCATIONS).map(([id,l])=>{
      const cnt = Object.values(POIS).filter(p=>p.loc===id).length;
      return `<button class="pin ${id===curLoc?'here':''}" data-loc="${id}" style="left:${l.mapX}%; top:${l.mapY}%;">
        <span class="p-orb"><span>${id===curLoc?'🚶':'📍'}</span></span>
        <span class="p-name">${l.name}<br><span class="p-cnt">뉴스 스팟 ${cnt}곳</span></span>
      </button>`;
    }).join('')}`;
  el.querySelectorAll('.pin').forEach(p=>{
    onTap(p, ()=>{
      if(p.dataset.loc===curLoc) return;
      curLoc = p.dataset.loc; save();
      renderAR(); renderMap();
      switchTab('ar');
      toast(`🐕 ${LOCATIONS[curLoc].name} 도착! (PoC라 순간이동)`);
    });
  });
}

/* 스팟별 폴더 컬러 (크레용 톤) */
const FCOLORS = {
  realty:{main:'#e0a63a', dark:'#a8781f', back:'#f0d391'},
  bank:  {main:'#7a8a4f', dark:'#59683a', back:'#c2cd9a'},
  store: {main:'#b09374', dark:'#846b52', back:'#ddc9b2'},
  sec:   {main:'#5b7a99', dark:'#3e566e', back:'#aec4d8'},
  fx:    {main:'#7fa8c9', dark:'#557b99', back:'#c3daea'},
  cafe:  {main:'#8a6f9e', dark:'#655177', back:'#c9b8d8'},
  vacant:{main:'#c96f4a', dark:'#94502f', back:'#e8b49b'},
};

function renderDex(){
  const total = Object.entries(POIS).reduce((a,[id,p])=>a+p.news.length, 0);
  const li=levelOf(mwXp), cur=LEVELS[li], next=LEVELS[li+1];
  const pct = next ? Math.min(100, Math.round((mwXp-cur.min)/(next.min-cur.min)*100)) : 100;

  // 스팟별 폴더: 주운 뉴스는 흰 종이, 미수집은 ? 종이로 폴더 주머니에서 삐져나옴
  const folders = Object.entries(POIS).map(([id,p])=>{
    const got = p.news.filter((n,i)=>collected.has(id+'_'+i)).length;
    const tot = p.news.length;
    const c = FCOLORS[id];
    const papers = p.news.map((n,i)=>{
      const rot = (i - (tot-1)/2) * 10, top = i%2 ? 4 : 0;
      return collected.has(id+'_'+i)
        ? `<span class="f-paper" style="--rot:${rot}deg; --top:${top}px"></span>`
        : `<span class="f-paper q" style="--rot:${rot}deg; --top:${top}px">?</span>`;
    }).join('');
    return `
      <button class="folder ${got===0?'empty':''}" data-poi="${id}"
              style="--fmain:${c.main}; --fdark:${c.dark}; --fback:${c.back};">
        <span class="f-tab"></span>
        <span class="f-back"></span>
        <span class="f-papers">${papers}</span>
        <span class="f-front">
          <span class="f-name">${p.emoji} ${p.name}</span>
          <span class="f-loc">📍 ${LOCATIONS[p.loc].name}</span>
          <span class="f-cnt">${got}<small>/${tot}</small></span>
        </span>
        ${got===tot ? '<span class="f-done">✓</span>' : ''}
      </button>`;
  }).join('');

  document.getElementById('dexView').innerHTML = `
    <h2>📔 산책 수첩</h2>
    <div class="dex-sub">강아지랑 주운 뉴스 <b style="color:#c96f4a;">${collected.size}</b> / ${total}건 — 다 모으면 이 동네 경제가 보여요</div>
    <div class="dex-xp">
      <div class="row">
        ${blobHtml(cur.bc, cur.mood, 'sm')}
        <span><span class="nm">${cur.name}</span><br><span class="lv">Lv.${li+1} · ${mwXp} XP</span></span>
        <span class="st">🔥 3일째 산책</span>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="nxt">${next?`다음 레벨 ${next.name}까지 ${next.min-mwXp} XP`:'최고 레벨! 🎉'}</div>
    </div>
    <div class="dex-grid">${folders}</div>
    <div class="dex-tip">폴더를 누르면 그 스팟의 뉴스를 바로 볼 수 있어요</div>`;

  document.querySelectorAll('#dexView .folder').forEach(f=>{
    onTap(f, ()=>openSheet(f.dataset.poi));
  });
}

/* ─────────────────────────────────────────────
   바텀시트: 스팟 상세 (시세 + 뉴스 줍기)
───────────────────────────────────────────── */
function openSheet(poiId){
  curPoi = poiId;
  const p = POIS[poiId];
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sh-head">
      <span class="sh-emoji">${p.emoji}</span>
      <span><div class="sh-name">${p.name}</div><div class="sh-loc">📍 ${LOCATIONS[p.loc].name} · ${p.dist} 앞</div></span>
    </div>
    <div class="stat-card">
      <div class="s-label">${p.stat.label}</div>
      <div class="s-value">${p.stat.value}</div>
      <div class="s-delta ${p.stat.dir}">${p.stat.delta}</div>
      <div class="s-src">${p.stat.src}</div>
    </div>
    <p class="sh-sub">🐾 강아지가 찾아낸 뉴스</p>
    ${p.news.map((n,i)=>{
      const key = poiId+'_'+i;
      const picked = collected.has(key);
      const imp = (mwProfile && mwProfile.includes(n.impact.tag))
        ? `<div class="n-impact">💰 <b class="t">${TAGS[n.impact.tag].emoji} ${TAGS[n.impact.tag].label}인 나에게:</b> ${n.impact.text}</div>` : '';
      return `<div class="news-item">
        <h4>${n.title}${readNews.has(key)?'<span class="read-chip">읽음 ✓</span>':''}</h4>
        <p class="n-sum">${n.sum}</p>
        ${imp}
        <button class="pick-btn" data-idx="${i}" ${picked?'disabled':''}>
          ${picked ? '줍줍 완료 🐾' : `기사 읽고 줍줍 📖 +${XP_PICK} XP`}
        </button>
      </div>`;
    }).join('')}`;
  sheet.querySelectorAll('.pick-btn:not(:disabled)').forEach(b=>{
    onTap(b, ()=>{ if(!b.disabled) openReader(poiId, parseInt(b.dataset.idx,10)); });
  });
  document.getElementById('sheetBg').classList.add('open');
  sheet.offsetHeight; // 리플로우 강제 → 백그라운드 탭에서도 슬라이드업 보장
  sheet.classList.add('open');
}

/* ─────────────────────────────────────────────
   기사 리더: 끝까지 읽어야 줍기 버튼 활성화
───────────────────────────────────────────── */
function openReader(poiId, idx){
  const p = POIS[poiId], n = p.news[idx], key = poiId+'_'+idx;
  const picked = collected.has(key);
  const paras = BODIES[key] || [n.sum];
  const imp = (mwProfile && mwProfile.includes(n.impact.tag))
    ? `<div class="r-impact-title">💰 내 지갑 번역</div>
       <div class="n-impact"><b class="t">${TAGS[n.impact.tag].emoji} ${TAGS[n.impact.tag].label}인 나에게:</b> ${n.impact.text}</div>` : '';
  const reader = document.getElementById('reader');
  reader.innerHTML = `
    <div class="reader-top">
      <button class="r-back" id="rBack">←</button>
      <span class="r-src">${p.emoji} ${p.name}에서 발견한 기사</span>
    </div>
    <div class="reader-body" id="rBody">
      <div class="r-cat">📍 ${LOCATIONS[p.loc].name} · ${p.stat.label} ${p.stat.value}</div>
      <h2>${n.title}</h2>
      <div class="r-meta">한국경제 · 2026.07.06</div>
      ${paras.map(t=>`<p class="r-p">${t}</p>`).join('')}
      ${imp}
      <button class="pick-btn" id="rPick" disabled>
        ${picked ? '줍줍 완료 🐾' : '⬇ 기사를 끝까지 읽으면 줍줍할 수 있어요'}
      </button>
    </div>`;
  onTap(reader.querySelector('#rBack'), closeReader);

  const body = reader.querySelector('#rBody');
  const pickBtn = reader.querySelector('#rPick');

  function unlock(){
    if(!readNews.has(key)){ readNews.add(key); save(); }
    if(picked || collected.has(key)) return;      // 이미 주운 뉴스는 읽기만
    pickBtn.disabled = false;
    pickBtn.textContent = `이 뉴스 줍줍 🐾 +${XP_PICK} XP`;
  }
  function checkEnd(){
    if(body.scrollTop + body.clientHeight >= body.scrollHeight - 24) unlock();
  }
  body.addEventListener('scroll', checkEnd);
  setTimeout(checkEnd, 100);   // 본문이 짧아 스크롤이 없는 경우 즉시 해제

  onTap(pickBtn, ()=>{
    if(pickBtn.disabled || collected.has(key)) return;
    collected.add(key); save();
    pickBtn.disabled = true; pickBtn.textContent = '줍줍 완료 🐾';
    addXP(XP_PICK, '멍! 뉴스 물어왔어요 🐶');
    if(p.news.every((nn,i)=>collected.has(poiId+'_'+i))){
      setTimeout(()=>addXP(XP_SPOT_ALL, `${p.name} 스팟 클리어! 🦴`), 400);
    }
    renderAR(); renderDex();
    setTimeout(()=>{ closeReader(); openSheet(poiId); }, 700);  // 시트로 복귀(상태 갱신)
  });

  reader.offsetHeight;
  reader.classList.add('open');
}
function closeReader(){
  document.getElementById('reader').classList.remove('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBg').classList.remove('open');
}
onTap(document.getElementById('sheetBg'), closeSheet);

/* ─────────────────────────────────────────────
   탭 / 온보딩 / 초기화
───────────────────────────────────────────── */
function switchTab(tab){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById('scene-'+tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='dex') renderDex();
  closeSheet();
  closeReader();
}
document.querySelectorAll('.tabbar button').forEach(b=>{
  onTap(b, ()=>switchTab(b.dataset.tab));
});

/* 온보딩 */
document.querySelectorAll('#onbChips button').forEach(b=>{

onTap(document.getElementById('onbGo'), ()=>{
  startWalk([...document.querySelectorAll('#onbChips button.sel')].map(b=>b.dataset.tag));
});
onTap(document.getElementById('onbSkip'), ()=>startWalk([]));

/* 초기화 */
document.querySelectorAll('.dog-ph').forEach(el=>{
  el.outerHTML = blobHtml(el.dataset.c, el.dataset.m||'', el.dataset.s||'');
});
renderLvChip();
renderAR();
renderMap();
renderDex();
if(mwProfile !== null) document.getElementById('onb').style.display = 'none';
</script>
</body>
